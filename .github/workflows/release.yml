# Every push to main: test, build the Linux binary, and publish a GitHub
# release. notus-swap's update button installs the newest of these releases
# unless it is set up to use a Gitea server (see .gitea/workflows).
name: release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run build

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build
        run: |
          VERSION="$(date -u +%Y.%m.%d.%H%M)-${GITHUB_SHA::7}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
            -o dist/notus-swap-linux-amd64 ./cmd/notus-swap
          cd dist && sha256sum notus-swap-linux-amd64 > notus-swap-linux-amd64.sha256
          cat notus-swap-linux-amd64.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --format=%B > notes.txt
          gh release create "$VERSION" dist/* --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.txt
          echo "released $VERSION"
