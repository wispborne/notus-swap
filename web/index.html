<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/notus/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/notus/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/notus/favicon-16.png" />
    <link rel="apple-touch-icon" href="/notus/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>notus-swap</title>
    <!-- Sets the saved colour theme and app title before the page draws. See src/lib/theme.svelte.ts and src/lib/appTitle.svelte.ts. -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t) document.documentElement.dataset.theme = t
        var n = localStorage.getItem('app_title')
        if (n) document.title = n
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
